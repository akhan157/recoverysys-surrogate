[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "surrogate-recoverysys"
version = "0.1.0"
description = "Neural network surrogate model for RecoverySys high-power rocketry flight simulation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyarrow>=16",
    "httpx>=0.27",
    "tqdm>=4.66",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
dev = [
    "pytest>=8",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.urls]
Repository = "https://github.com/akhan157/recoverysys-surrogate"

[tool.setuptools.packages.find]
where = ["."]
include = ["surrogate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
